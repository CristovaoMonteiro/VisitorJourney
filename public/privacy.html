<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Privacy</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/pages/privacy.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>

    <main id="main" class="container page">
      <article class="prose">
        <h1 class="page-title" data-i18n="privacy.title"></h1>
        <p class="prose__lead" data-i18n="privacy.intro"></p>

        <h2 data-i18n="privacy.collect.title"></h2>
        <p data-i18n="privacy.collect.text"></p>

        <h2 data-i18n="privacy.never.title"></h2>
        <p data-i18n="privacy.never.text"></p>

        <h2 data-i18n="privacy.basis.title"></h2>
        <p data-i18n="privacy.basis.text"></p>

        <h2 data-i18n="privacy.choices.title"></h2>
        <p data-i18n="privacy.choices.text"></p>

        <p class="notice">
          <span data-i18n="privacy.status"></span> <strong data-consent-status></strong>
        </p>
        <button type="button" class="btn btn--secondary" data-privacy-settings data-i18n="privacy.change"></button>
      </article>
    </main>

    <footer id="site-footer" class="site-footer"></footer>
  </body>
</html>
