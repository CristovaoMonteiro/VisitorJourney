# Render Blueprint: one free Node web service serving the store, API and dashboard.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: visitor-journey
    runtime: node
    plan: free
    # EU region, alongside an EU MongoDB Atlas cluster (GDPR: data stays in the EU).
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      # Render sits behind one proxy: needed so rate limiting sees the client, not the proxy.
      - key: TRUST_PROXY
        value: 1
      - key: MONGODB_URI
        sync: false
      # Optional: leave empty for a public, read-only dashboard.
      - key: DASHBOARD_PASSWORD
        sync: false
